      "address": {
        "@type": "PostalAddress",
        "addressCountry": "SG",

      },
      "areaServed": {
        "@type": "Country",
        "name": "Singapore"
      },
      "knowsAbout": [
        "AI automation",
        "AI infrastructure",
        "Document chasing and collection automation",
        "Lead response and qualification",
        "Client communication automation",

        "AI for professional services"

              "@type": "Service",

              "description": "Custom AI infrastructure architected around your business logic, integrated with your CRM, calendar and WhatsApp."
            }
          },
          {
            "@type": "Offer",

              "@type": "Service",

              "description": "Phased rollout with zero disruption, team onboarding, performance monitoring and ongoing iteration."
            }
          }
        ]
      }
    }

          "name": "How long does it take to deploy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Typical timeline from workflow audit to full deployment is 2 to 3 weeks, depending on complexity."
          }
        },
        {
          "@type": "Question",
          "name": "What if the AI gives the wrong answer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We strictly guardrail our AI using your specific business logic. It only answers what it is explicitly trained on and escalates complex issues to your team."
          }
        },
        {
          "@type": "Question",
          "name": "Is it compliant with data protection laws?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Built with strict data privacy in mind. We comply with PDPA and ensure sensitive client information is handled securely."
          }
        },

          "@type": "Question",
